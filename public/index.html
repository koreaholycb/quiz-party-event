<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>송년회 게임</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#2b3bff;--ink:#12122b;--y:#ffe14d;--p:#ff6fb1;--soft:#eef0ff}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:#fff;font-family:Jua,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:460px;margin:0 auto;padding:28px 0 40px}
h1{font-size:44px;line-height:1.1;margin:0 0 6px;font-weight:400}
.sub{margin:0 0 18px;opacity:.9}
.card{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);padding:18px;margin-bottom:16px}
input,button{font:inherit;width:100%;border:3px solid var(--ink);border-radius:14px;padding:13px 14px;font-size:18px}
input{background:#fff;color:var(--ink);margin-bottom:10px}
input:focus-visible,button:focus-visible{outline:3px solid var(--p);outline-offset:2px}
button{background:var(--y);color:var(--ink);cursor:pointer;margin-bottom:10px;box-shadow:3px 3px 0 var(--ink)}
button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.teams button{margin:0;box-shadow:none;background:#fff;font-size:17px}
.teams button.on{background:var(--y)}
.err{color:#c4004f;min-height:1.2em;margin:0}
.track{height:14px;background:#fff;border:3px solid var(--ink);border-radius:9px;overflow:hidden;margin:10px 0 16px}
#bar{height:100%;width:100%;background:var(--p)}
#hint{display:table;margin:0 auto 6px;font-size:32px;background:var(--y);color:var(--ink);border:3px solid var(--ink);border-radius:99px;padding:4px 22px;text-align:center}
.q{font-size:46px;text-align:center;margin:18px 0 6px;letter-spacing:.06em;word-break:keep-all}
#msg{min-height:1.5em;text-align:center;font-size:20px;margin:6px 0 10px}
.big{font-size:34px;margin:0 0 8px}
.mt{position:relative;height:60px;background:#fff;border:3px solid var(--ink);border-radius:30px;margin:6px 0 26px}
.mt::after{content:'🏁';position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:28px;opacity:.5}
#mf{height:100%;width:0;background:var(--p);border-radius:27px;transition:width .12s linear}
#mr{position:absolute;top:50%;left:0;margin-top:-26px;font-style:normal;font-size:44px;line-height:52px;transition:left .12s linear,transform .12s linear}
#tap{height:240px;font-size:64px;background:var(--p);color:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#tap:disabled{opacity:.5}
.shake{animation:sk .3s}@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media(prefers-reduced-motion:reduce){.shake{animation:none}#bar{transition:none!important}}
[hidden]{display:none!important}
</style></head><body><main>

<section id="join">
  <h1>송년회<br>게임</h1>
  <p class="sub">이름을 쓰고 입장해요</p>
  <div class="card">
    <input id="nm" maxlength="8" placeholder="이름 (8자까지)" autocomplete="off">
    <button id="go">입장</button>
    <p class="err" id="err"></p>
  </div>
</section>

<section id="wait" hidden>
  <h1 id="who"></h1>
  <p class="sub">곧 시작해요. 화면을 켜 두세요!</p>
  <div class="card"><p id="wm" style="margin:0">관리자가 시작하면 문제가 나와요.</p></div>
</section>

<section id="quiz" hidden>
  <p class="big" id="top"></p>
  <div class="track"><div id="bar"></div></div>
  <div class="card"><p id="hint"></p><div class="q" id="qq"></div></div>
  <div id="msg"></div>
  <form id="qf"><input id="ans" autocomplete="off" placeholder="정답 입력"><button type="submit">제출</button></form>
</section>

<section id="imgq" hidden>
  <p class="big" id="itop"></p>
  <div class="card" id="icard" style="padding:10px"><img id="iimg" alt="맞혀 보세요" style="width:100%;border-radius:12px;display:block"></div>
  <p id="inote" class="sub" hidden>큰 화면을 보고 맞혀 보세요!</p>
  <div id="imsg" style="min-height:1.5em;text-align:center;font-size:20px;margin:6px 0 10px"></div>
  <form id="iqf"><input id="ians" autocomplete="off" placeholder="정답 입력"><button type="submit">제출</button></form>
</section>

<section id="won" hidden>
  <p class="big" style="text-align:center">🎉 정답자가 나왔어요!</p>
  <div class="card"><p style="margin:0;font-size:22px;line-height:1.6">관리자가 정답을 공개할 때까지 기다려요.</p></div>
</section>

<section id="res" hidden>
  <p class="big" id="rt"></p>
  <div class="card"><p id="rb" style="margin:0;font-size:22px;line-height:1.6"></p></div>
  <p class="sub">다음 게임을 기다려요…</p>
</section>

<section id="race" hidden>
  <p class="big" id="rc" style="text-align:center">준비!</p>
  <button id="tap" disabled>…</button>
</section>

</main>
<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id), s = io(), L = localStorage;
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let id = L.qp_id || (L.qp_id = Math.random().toString(36).slice(2) + Date.now().toString(36));
let joined = false, phase = 'idle', curQ = -1, done = false, cnt = 0, pend = 0, goal = 80;
const show = x => ['join', 'wait', 'quiz', 'res', 'race', 'imgq', 'won'].forEach(k => $(k).hidden = k !== x);
$('nm').value = L.qp_name || '';

function join() {
  const name = $('nm').value.trim();
  if (!name) { $('err').textContent = '이름을 써 주세요.'; return; }
  s.emit('hello', { id, name }, r => {
    if (r.err) { joined = false; $('err').textContent = r.err; return; }
    joined = true; L.qp_name = r.name;
    $('who').textContent = r.name;
  });
}
$('go').onclick = join;
s.on('connect', () => { if (L.qp_name) { $('nm').value = L.qp_name; join(); } });

function startQ(d) {
  show('quiz');
  if (curQ !== d.qn) { curQ = d.qn; done = false; $('ans').value = ''; $('ans').disabled = false; $('msg').textContent = ''; }
  $('top').textContent = `${d.qn}번째 문제`; $('hint').textContent = d.q.hint; $('qq').textContent = d.q.q;
  const b = $('bar');
  b.style.transition = 'none'; b.style.width = (d.left / (d.sec * 1000) * 100) + '%';
  requestAnimationFrame(() => requestAnimationFrame(() => { b.style.transition = `width ${d.left}ms linear`; b.style.width = '0'; }));
  if (!done) $('ans').focus();
}
s.on('phase', d => {
  phase = d.phase;
  if (!joined) return show('join');
  if (d.phase === 'quiz') startQ(d);
  else if (d.phase === 'raceCount') { show('race'); $('rc').textContent = '준비!'; $('tap').disabled = true; $('tap').textContent = '…'; }
  else if (d.phase === 'race') { show('race'); $('rc').textContent = '달려요!'; $('tap').disabled = false; $('tap').textContent = 'TAP!'; }
  else if (d.phase === 'quizWait') {
    show('quiz'); $('top').textContent = `${d.qn}번째 문제`; $('hint').textContent = d.q.hint; $('qq').textContent = d.q.q;
    $('bar').style.transition = 'none'; $('bar').style.width = '0'; $('ans').disabled = true;
    $('msg').textContent = done ? '정답을 맞혔어요! 정답 발표를 기다려요…' : '시간 끝! 정답 발표를 기다려요…';
  }
  else if (d.phase === 'img') startImg(d);
  else if (d.phase === 'imgWon') show('won');   // 정답자 본인에게도 알리지 않고 모두 같은 화면을 봐요
  else if (['idle', 'quizRank', 'raceRank', 'imgRank'].includes(d.phase)) { show('wait'); $('wm').textContent = d.phase === 'idle' ? '관리자가 시작하면 문제가 나와요.' : '게임 끝! 순위는 큰 화면에서 확인해요 🏆'; }
  else if ($('res').hidden) show('wait');
});
s.on('kicked', () => { L.qp_id = id = Math.random().toString(36).slice(2) + Date.now().toString(36); delete L.qp_name; joined = false; $('nm').value = ''; $('err').textContent = '관리자가 참가 정보를 지웠어요. 다시 입장해 주세요.'; show('join'); });

let imgN = -1, idone = false;
function startImg(d) {
  show('imgq');
  if (imgN !== d.qn) {
    imgN = d.qn; idone = false; $('ians').value = ''; $('ians').disabled = false; $('imsg').textContent = '';
    if (d.q.img) $('iimg').src = d.q.img;
  }
  $('itop').textContent = `${d.qn}번째 문제${d.q.hint ? ' · ' + d.q.hint : ''}`;
  $('icard').hidden = !d.q.img; $('iqf').hidden = !!d.q.offline;
  $('inote').textContent = d.q.offline ? '정답은 말로 외쳐 주세요! 🙋' : '큰 화면을 보고 맞혀 보세요!';
  $('inote').hidden = !!d.q.img && !d.q.offline;
}
$('iimg').onerror = () => { $('imsg').textContent = '이미지를 불러오지 못했어요. 새로고침해 주세요.'; };
s.on('preload', u => { new Image().src = u; });
$('iqf').onsubmit = e => {
  e.preventDefault();
  const v = $('ians').value.trim();
  if (!v || idone) return;
  s.emit('answer', v, r => {
    if (r === true) { idone = true; show('won'); }   // 정답자도 다른 사람과 똑같은 화면만 봐요
    else if (r === 'taken') show('won');
    else if (r === 'late') $('imsg').textContent = '지금은 제출할 수 없어요';
    else { $('ians').value = ''; $('imsg').textContent = '오답 ✗ 다시 도전!'; $('ians').classList.add('shake'); setTimeout(() => $('ians').classList.remove('shake'), 300); }
  });
};
$('qf').onsubmit = e => {
  e.preventDefault();
  const v = $('ans').value.trim();
  if (!v || done) return;
  s.emit('answer', v, r => {
    if (r === true) { done = true; $('ans').disabled = true; $('ans').value = ''; $('msg').textContent = '정답! 🎉'; }
    else if (r === 'late') $('msg').textContent = '시간이 끝났어요';
    else { $('ans').value = ''; $('msg').textContent = '오답 ✗ 다시 도전!'; $('ans').classList.add('shake'); setTimeout(() => $('ans').classList.remove('shake'), 300); }
  });
};
s.on('reveal', x => {
  show('res');
  $('rt').textContent = x.ok === null ? '정답 공개!' : x.ok ? '정답!' : '아쉬워요!';
  $('rb').innerHTML = `정답: <b>${esc(x.answer)}</b>`;
});
s.on('count', n => { $('rc').textContent = n; });
$('tap').onpointerdown = () => { if (phase !== 'race') return; pend++; };   // 달리는 모습은 관리자 화면에만 나와요
setInterval(() => { if (pend) { s.emit('tap', pend); pend = 0; } }, 300);
s.on('raceEnd', x => {
  pend = 0; show('res');
  $('rt').textContent = '달리기 끝!';
  $('rb').innerHTML = '순위는 큰 화면에서 확인해요 👀';
});
</script></body></html>
