<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>송년회 게임</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#2b3bff;--ink:#12122b;--y:#ffe14d;--p:#ff6fb1;--soft:#eef0ff}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:#fff;font-family:Jua,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:460px;margin:0 auto;padding:28px 0 40px}
h1{font-size:44px;line-height:1.1;margin:0 0 6px;font-weight:400}
.sub{margin:0 0 18px;opacity:.9}
.card{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);padding:18px;margin-bottom:16px}
input,button{font:inherit;width:100%;border:3px solid var(--ink);border-radius:14px;padding:13px 14px;font-size:18px}
input{background:#fff;color:var(--ink);margin-bottom:10px}
input:focus-visible,button:focus-visible{outline:3px solid var(--p);outline-offset:2px}
button{background:var(--y);color:var(--ink);cursor:pointer;margin-bottom:10px;box-shadow:3px 3px 0 var(--ink)}
button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.teams button{margin:0;box-shadow:none;background:#fff;font-size:17px}
.teams button.on{background:var(--y)}
.err{color:#c4004f;min-height:1.2em;margin:0}
.track{height:14px;background:#fff;border:3px solid var(--ink);border-radius:9px;overflow:hidden;margin:10px 0 16px}
#bar{height:100%;width:100%;background:var(--p)}
#hint{margin:0;opacity:.7;text-align:center}
.q{font-size:46px;text-align:center;margin:18px 0 6px;letter-spacing:.06em;word-break:keep-all}
#msg{min-height:1.5em;text-align:center;font-size:20px;margin:6px 0 10px}
.big{font-size:34px;margin:0 0 8px}
#tap{height:240px;font-size:64px;background:var(--p);color:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#tap:disabled{opacity:.5}
.shake{animation:sk .3s}@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media(prefers-reduced-motion:reduce){.shake{animation:none}#bar{transition:none!important}}
[hidden]{display:none!important}
</style></head><body><main>

<section id="join">
  <h1>송년회<br>게임</h1>
  <p class="sub">이름을 쓰고 우리 팀을 골라요</p>
  <div class="card">
    <input id="nm" maxlength="8" placeholder="이름 (8자까지)" autocomplete="off">
    <div class="teams" id="tm"></div>
    <button id="go">입장</button>
    <p class="err" id="err"></p>
  </div>
</section>

<section id="wait" hidden>
  <h1 id="who"></h1>
  <p class="sub">곧 시작해요. 화면을 켜 두세요!</p>
  <div class="card"><p class="big" id="my"></p><p style="margin:0">게임이 끝날 때마다 점수가 업데이트돼요</p></div>
</section>

<section id="quiz" hidden>
  <p class="big" id="top"></p>
  <div class="track"><div id="bar"></div></div>
  <div class="card"><p id="hint"></p><div class="q" id="qq"></div></div>
  <div id="msg"></div>
  <form id="qf"><input id="ans" autocomplete="off" placeholder="정답 입력"><button type="submit">제출</button></form>
</section>

<section id="res" hidden>
  <p class="big" id="rt"></p>
  <div class="card"><p id="rb" style="margin:0;font-size:22px;line-height:1.6"></p></div>
  <p class="sub">다음 게임을 기다려요…</p>
</section>

<section id="race" hidden>
  <p class="big" id="rc" style="text-align:center">준비!</p>
  <button id="tap" disabled>…</button>
</section>

</main>
<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id), s = io(), L = localStorage;
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let id = L.qp_id || (L.qp_id = Math.random().toString(36).slice(2) + Date.now().toString(36));
let teams = [], team = L.qp_team || '', joined = false, phase = 'idle', curQ = -1, done = false, cnt = 0, pend = 0;
const show = x => ['join', 'wait', 'quiz', 'res', 'race'].forEach(k => $(k).hidden = k !== x);
$('nm').value = L.qp_name || '';

function renderTeams() {
  $('tm').innerHTML = teams.map(t => `<button type="button" class="${t === team ? 'on' : ''}" data-t="${esc(t)}">${esc(t)}</button>`).join('');
}
$('tm').onclick = e => { const t = e.target.dataset.t; if (t) { team = t; renderTeams(); } };
function join() {
  const name = $('nm').value.trim();
  if (!name || !team) { $('err').textContent = '이름을 쓰고 팀을 골라 주세요.'; return; }
  s.emit('hello', { id, name, team }, r => {
    if (r.err) { joined = false; $('err').textContent = r.err; return; }
    joined = true; L.qp_name = r.name; L.qp_team = r.team; team = r.team;
    $('who').textContent = `${r.name} · ${r.team}`; $('my').textContent = r.score + '점';
  });
}
$('go').onclick = join;
s.on('connect', () => { if (L.qp_name && L.qp_team) { $('nm').value = L.qp_name; team = L.qp_team; join(); } });

function startQ(d) {
  show('quiz');
  if (curQ !== d.qn) { curQ = d.qn; done = false; $('ans').value = ''; $('ans').disabled = false; $('msg').textContent = ''; }
  $('top').textContent = `${d.qn}번째 문제`; $('hint').textContent = d.q.hint; $('qq').textContent = d.q.q;
  const b = $('bar');
  b.style.transition = 'none'; b.style.width = (d.left / (d.sec * 1000) * 100) + '%';
  requestAnimationFrame(() => requestAnimationFrame(() => { b.style.transition = `width ${d.left}ms linear`; b.style.width = '0'; }));
  if (!done) $('ans').focus();
}
s.on('phase', d => {
  teams = d.teams; phase = d.phase; renderTeams();
  if (!joined) return show('join');
  if (d.phase === 'quiz') startQ(d);
  else if (d.phase === 'raceCount') { show('race'); cnt = 0; $('rc').textContent = '준비!'; $('tap').disabled = true; $('tap').textContent = '…'; }
  else if (d.phase === 'race') { show('race'); cnt = 0; $('rc').textContent = '달려요!'; $('tap').disabled = false; $('tap').textContent = 'TAP!'; }
  else if (d.phase === 'idle') show('wait');
  else if ($('res').hidden) show('wait');
});
s.on('profile', d => { team = d.team; L.qp_team = d.team; });
s.on('kicked', () => { L.qp_id = id = Math.random().toString(36).slice(2) + Date.now().toString(36); delete L.qp_name; delete L.qp_team; joined = false; team = ''; renderTeams(); $('nm').value = ''; $('err').textContent = '관리자가 참가 정보를 지웠어요. 다시 입장해 주세요.'; show('join'); });

$('qf').onsubmit = e => {
  e.preventDefault();
  const v = $('ans').value.trim();
  if (!v || done) return;
  s.emit('answer', v, g => {
    if (g) { done = true; $('ans').disabled = true; $('ans').value = ''; $('msg').textContent = `정답! +${g}점 🎉 결과를 기다려요`; }
    else { $('ans').value = ''; $('ans').classList.add('shake'); setTimeout(() => $('ans').classList.remove('shake'), 300); }
  });
};
s.on('reveal', x => {
  show('res'); $('my').textContent = x.score + '점';
  $('rt').textContent = x.gained ? `정답! +${x.gained}점` : '아쉬워요!';
  $('rb').innerHTML = `정답: <b>${esc(x.answer)}</b><br>내 점수 ${x.score}점 · 전체 ${x.rank}/${x.total}등`;
});
s.on('count', n => { $('rc').textContent = n; });
$('tap').onpointerdown = () => { if (phase !== 'race') return; cnt++; pend++; $('tap').textContent = cnt; };
setInterval(() => { if (pend) { s.emit('tap', pend); pend = 0; } }, 300);
s.on('raceEnd', x => {
  pend = 0; show('res'); $('my').textContent = x.score + '점';
  $('rt').textContent = x.gained ? `달리기 +${x.gained}점` : '달리기 끝!';
  $('rb').innerHTML = `${x.taps}번 달렸어요<br>달리기 ${x.raceRank ? x.raceRank + '등' : '기록 없음'} · 전체 ${x.rank}/${x.total}등`;
});
</script></body></html>
