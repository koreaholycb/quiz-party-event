<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>관리자</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#2b3bff;--ink:#12122b;--y:#ffe14d;--p:#ff6fb1;--soft:#eef0ff}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:#fff;font-family:Jua,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:980px;margin:0 auto;padding:20px 0 40px}
h1{font-size:34px;margin:0;font-weight:400}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--y);color:var(--ink);border:3px solid var(--ink);border-radius:99px;padding:2px 14px}
.card{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);padding:16px;margin-bottom:16px}
input,button,select{font:inherit;border:3px solid var(--ink);border-radius:14px;padding:11px 14px;font-size:18px;background:#fff;color:var(--ink)}
input{width:100%;margin-bottom:10px}
button{background:var(--y);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
button.g{background:#fff}
button:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed}
input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stage{text-align:center;min-height:230px}
#sHint{opacity:.65;font-size:22px}
#sBig{font-size:clamp(44px,9vw,88px);line-height:1.15;margin:8px 0;letter-spacing:.06em;word-break:keep-all}
#sNote{font-size:24px}
.track{height:16px;background:var(--soft);border:3px solid var(--ink);border-radius:9px;overflow:hidden;margin:10px auto;max-width:600px}
#bar{height:100%;width:0;background:var(--p)}
.lane{display:flex;align-items:center;gap:10px;margin:8px 0;text-align:left}
.lane b{width:84px;flex:none}
.lane .t{flex:1;height:26px;background:var(--soft);border-radius:13px;border:2px solid var(--ink);overflow:hidden}
.lane .f{height:100%;width:0;background:var(--p);transition:width .4s linear}
.lane span{width:72px;text-align:right;flex:none}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.cols{grid-template-columns:1fr}}
ol{list-style:none;padding:0;margin:8px 0 0}
li{display:flex;gap:10px;align-items:center;background:var(--soft);padding:8px 12px;border-radius:12px;margin-bottom:6px}
li .r{margin-left:auto;white-space:nowrap}
li button{padding:2px 10px;font-size:14px;box-shadow:none;margin-left:8px}
li.off{opacity:.5}
.scroll{max-height:460px;overflow:auto}
.err{color:#ffd0e3;min-height:1.2em}
.mut{opacity:.6;margin:6px 0 0}
[hidden]{display:none!important}
</style></head><body><main>

<section id="login" style="max-width:420px;margin:0 auto">
  <h1>관리자</h1><p>비밀번호를 입력해 주세요</p>
  <div class="card"><input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password"><button id="ok" style="width:100%">들어가기</button></div>
  <p class="err" id="err"></p>
</section>

<section id="dash" hidden>
  <div class="top"><h1>송년회 관리자</h1><span class="chip" id="ph"></span><span id="cn"></span></div>

  <div class="card row">
    <button id="nq">다음 문제 ▶</button>
    <span>|</span>
    <select id="rs" aria-label="달리기 시간"><option value="10">달리기 10초</option><option value="15">15초</option><option value="20">20초</option><option value="30">30초</option></select>
    <button id="rc">달리기 시작 🏃</button>
    <button id="sp" class="g">중단</button>
  </div>

  <div class="card stage">
    <div id="sHint"></div>
    <div id="sBig"></div>
    <div class="track" id="qt" hidden><div id="bar"></div></div>
    <div id="sNote"></div>
    <div id="lanes" hidden style="max-width:700px;margin:14px auto 0"></div>
    <div id="rtop" class="mut"></div>
  </div>

  <div class="cols">
    <div class="card"><b>팀 순위 (팀원 평균 점수)</b><ol id="tl"></ol></div>
    <div class="card"><b>개인 순위</b><div class="scroll"><ol id="bd"></ol></div></div>
  </div>

  <div class="card">
    <b>설정</b>
    <p class="mut" style="margin:4px 0 8px">팀 이름은 쉼표로 구분해요 (최대 12팀)</p>
    <div class="row"><input id="tn" style="flex:1;margin:0" value="1팀,2팀,3팀,4팀,5팀"><button id="tb">팀 적용</button></div>
    <div class="row" style="margin-top:12px">
      <button id="csv" class="g">점수 파일 저장(CSV)</button>
      <button id="rsc" class="g">점수만 초기화</button>
      <button id="rall" class="g">전체 초기화</button>
      <button id="out" class="g">로그아웃</button>
    </div>
  </div>
</section>

</main>
<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id), s = io();
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const medal = i => ['🥇', '🥈', '🥉'][i] || i + 1;
const NAMES = { idle: '대기 중', quiz: '초성 퀴즈 진행 중', quizEnd: '문제 종료', raceCount: '달리기 준비', race: '달리기 진행 중', raceEnd: '달리기 종료' };
let pw = sessionStorage.getItem('pw') || '', last = null, lastQn = -1, raceEndAt = 0, teamsSet = false;

function login() {
  if (!pw) return;
  s.emit('auth', pw, r => {
    if (r.err) { sessionStorage.removeItem('pw'); pw = ''; $('err').textContent = r.err; $('login').hidden = false; $('dash').hidden = true; return; }
    $('login').hidden = true; $('dash').hidden = false;
  });
}
s.on('connect', login);
$('ok').onclick = () => { pw = $('pw').value; sessionStorage.setItem('pw', pw); $('err').textContent = ''; login(); };
$('pw').onkeydown = e => { if (e.key === 'Enter') $('ok').click(); };
$('out').onclick = () => { sessionStorage.removeItem('pw'); location.reload(); };

s.on('admin', d => {
  last = d;
  const free = ['idle', 'quizEnd', 'raceEnd'].includes(d.phase);
  $('ph').textContent = NAMES[d.phase] || d.phase;
  $('cn').textContent = `접속 ${d.online}명 / 등록 ${d.total}명`;
  $('nq').disabled = !free; $('rc').disabled = !free; $('sp').disabled = free;
  $('nq').textContent = d.qn ? `다음 문제 ▶ (${d.qn}번 진행됨)` : '첫 문제 시작 ▶';
  if (!teamsSet) { $('tn').value = d.teams.map(t => t.team).join(','); teamsSet = true; }

  const inRace = ['raceCount', 'race', 'raceEnd'].includes(d.phase);
  $('lanes').hidden = !inRace; $('qt').hidden = d.phase !== 'quiz';
  $('sHint').textContent = d.q ? d.q.hint : '';
  if (d.phase === 'idle') { $('sBig').textContent = '준비 완료'; $('sNote').textContent = `참가자를 기다리는 중 · ${d.online}명 접속`; }
  if (d.q && d.phase === 'quiz') { $('sBig').textContent = d.q.q; $('sNote').textContent = `${d.correctN}명 정답`; }
  if (d.phase === 'quizEnd') { $('sBig').textContent = d.q.q; $('sNote').textContent = `정답: ${d.q.answer} · ${d.correctN}명 정답`; }
  if (d.phase === 'raceCount') { $('sBig').textContent = '달리기 준비!'; $('sNote').textContent = '곧 시작해요'; }
  if (d.phase === 'race') { raceEndAt = Date.now() + d.raceLeft; $('sNote').textContent = '최대한 빨리 누르세요!'; }
  if (d.phase === 'raceEnd') { $('sBig').textContent = '달리기 끝!'; $('sNote').textContent = '팀 순위를 확인하세요'; }
  if (d.phase === 'quiz' && lastQn !== d.qn) {
    lastQn = d.qn;
    const b = $('bar'); b.style.transition = 'none'; b.style.width = (d.left / (d.sec * 1000) * 100) + '%';
    requestAnimationFrame(() => requestAnimationFrame(() => { b.style.transition = `width ${d.left}ms linear`; b.style.width = '0'; }));
  }
  if (inRace) {
    const max = Math.max(...d.teams.map(t => t.taps), 1);
    $('lanes').innerHTML = d.teams.map(t => `<div class="lane"><b>${esc(t.team)}</b><div class="t"><div class="f" style="width:${Math.max(t.taps / max * 100, 2)}%"></div></div><span>${t.taps}회</span></div>`).join('');
    $('rtop').textContent = d.raceTop.length ? '개인 TOP: ' + d.raceTop.map((p, i) => `${i + 1}.${p.name}(${p.taps})`).join('  ') : '';
  } else $('rtop').textContent = '';

  const ts = [...d.teams].sort((a, b) => b.score - a.score);
  $('tl').innerHTML = ts.map((t, i) => `<li><b>${medal(i)}</b> ${esc(t.team)} <small>(${t.n}명)</small><span class="r">${t.score}점</span></li>`).join('');
  $('bd').innerHTML = d.board.length ? d.board.map((p, i) =>
    `<li class="${p.on ? '' : 'off'}"><b>${medal(i)}</b> ${esc(p.name)} <small>${esc(p.team)}</small><span class="r">${p.score}점<button data-id="${esc(p.id)}" data-n="${esc(p.name)}">삭제</button></span></li>`).join('')
    : '<p class="mut">아직 참가자가 없어요</p>';
});
setInterval(() => { if (last && last.phase === 'race') $('sBig').textContent = '🏃 ' + Math.max(0, Math.ceil((raceEndAt - Date.now()) / 1000)) + '초'; }, 200);

$('nq').onclick = () => s.emit('nextQ');
$('rc').onclick = () => s.emit('race', Number($('rs').value));
$('sp').onclick = () => { if (confirm('진행 중인 게임을 중단할까요?')) s.emit('stop'); };
$('tb').onclick = () => s.emit('teams', $('tn').value);
$('rsc').onclick = () => { if (confirm('모든 참가자의 점수를 0점으로 되돌릴까요?')) s.emit('resetScores'); };
$('rall').onclick = () => { if (confirm('참가자를 모두 지우고 처음 상태로 돌릴까요? 되돌릴 수 없어요.')) s.emit('resetAll'); };
$('bd').onclick = e => { const id = e.target.dataset && e.target.dataset.id; if (id && confirm(`"${e.target.dataset.n}" 참가자를 삭제할까요?`)) s.emit('kick', id); };
$('csv').onclick = () => {
  if (!last) return;
  const rows = ['순위,이름,팀,점수', ...last.board.map((p, i) => `${i + 1},"${p.name.replace(/"/g, '""')}","${p.team}",${p.score}`),
    '', '팀,인원,평균점수', ...last.teams.map(t => `"${t.team}",${t.n},${t.score}`)];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.join('\n')], { type: 'text/csv' }));
  a.download = '송년회_점수.csv'; a.click();
};
</script></body></html>
